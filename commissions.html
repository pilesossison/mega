<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>comms</title>
    <link rel="icon" type="image/png" href="output-onlinepngtools_pixel.png">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:#fff;color:#111;font-family:'Press Start 2P', monospace;cursor:crosshair}
      .headerwrapper{display:flex;flex-direction:column;margin-bottom:1rem}
      .header{width:100%;display:flex;justify-content:center;align-items:center;height:200px;background:#111;border-bottom:4px solid #000;position:relative;overflow:hidden}
      .header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.04) 50%, rgba(0,0,0,0.06) 100%);}
      .title{color:#fff;letter-spacing:0.2rem;text-shadow:0 0 10px #111;font-family:'Press Start 2P', monospace;position:relative;z-index:1;display:block;padding:1rem 2rem;border:3px solid #fff;background:rgba(255,255,255,0.06);text-transform:uppercase}
      .nav{background:#111;width:100%;text-align:center;padding:0.5rem 0}
      .nav ul{display:flex;justify-content:space-around;list-style:none}
      .nav li{display:inline}
      .nav a{color:#fff;text-decoration:none}
      .nav a:visited{color:#fff}
      .nav-disabled{pointer-events:none;opacity:0.45;text-decoration:line-through;cursor:default;color:#999 !important}
      .page-doll{position:fixed;left:20px;bottom:18px;width:min(220px,28vw);height:auto;z-index:20;pointer-events:auto;opacity:0.92;filter:grayscale(0.2) contrast(1.05) saturate(0.8) drop-shadow(0 0 12px rgba(0,0,0,0.2));transition:transform .2s ease,filter .2s ease,opacity .2s ease;}
      .page-doll:hover{transform:translateY(-4px) scale(1.04);filter:grayscale(1) contrast(1.2) saturate(0) drop-shadow(0 0 16px rgba(0,0,0,0.32));opacity:1;}
      .meet-man{position:fixed;left:20px;bottom:calc(18px + min(220px,28vw));z-index:21;width:min(220px,28vw);color:#111;font-size:.65rem;line-height:1.4;text-align:center;pointer-events:none;}
      .meet-man b{display:block;font-size:1.2rem;line-height:1;}
      .mainwrapper{display:flex;flex-direction:column;gap:1rem;padding:0 1rem 1rem;margin:0 auto;max-width:700px}
      .box{background:#eee}
      .subheaders{color:#fff;font-weight:normal;font-size:18px;background:#111}
      .content{padding:1rem;display:flex;flex-direction:column;gap:1rem}
      a{text-decoration:underline;color:#000}
      a:visited{color:#000}
      .blinkies{display:inline-flex;gap:.2rem;animation:blinkies .7s steps(2,end) infinite}
      @keyframes blinkies{0%,49%{opacity:.2}50%,100%{opacity:1}}
    </style>
  </head>
  <body>
    <div class="headerwrapper">
      <div class="header"><h1 class="title">Banner</h1></div>
      <div class="nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="art-portfolio.html">Art Portfolio</a></li>
          <li><a href="music.html">Music</a></li>
          <li><a href="commissions.html" class="nav-disabled" aria-disabled="true">Commissions</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li><a href="links.html">Links</a></li>
        </ul>
      </div>
    </div>
    <div class="mainwrapper">
      <div class="box">
        <h3 class="subheaders">Commissions <span class="blinkies" aria-hidden="true">✦✦✦</span></h3>
        <div class="content">
          <p>WIP</p>
        </div>
      </div>
    </div>
    <a href="character.html" aria-label="View character page"><span class="meet-man">meet the man <b aria-hidden="true">&darr;</b></span><img class="page-doll" src="103599877_yPZXbSDLUPp89ui.gif" alt="Page doll" title="art by @bwuizl" onerror="this.style.display='none'"></a>
  </body>
</html>
